[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-shield"
version = "0.1.0"
description = "Runtime security wrapper for AI coding agents — intercept, analyze, and enforce MCP and process-tree policies."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Agent Shield Team" },
]
keywords = ["ai", "agent", "security", "mcp", "codex", "kilo", "claude"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "requests>=2.31.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.scripts]
agent-shield = "cli:main"

[project.urls]
Homepage = "https://github.com/agent-shield/agent-shield"
Documentation = "https://github.com/agent-shield/agent-shield#readme"
Repository = "https://github.com/agent-shield/agent-shield"
Issues = "https://github.com/agent-shield/agent-shield/issues"

[tool.hatch.build.targets.wheel]
packages = [
    "agents",
    "ai-agent",
]

[tool.hatch.build.targets.sdist]
include = [
    "agents/",
    "cli.py",
    "config.py",
    "mcp_interceptor.py",
    "mcp_detector.py",
    "risk_engine.py",
    "api_client.py",
    "README.md",
]
